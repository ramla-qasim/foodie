<!DOCTYPE html>
<html>

<head>

    <title>Restaurant Management System - Lab 04</title>
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/590/590685.png">
    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1>Restaurant Management System</h1>

    <p class="subtitle">JavaScript Array of Objects - CRUD Operations</p>


    <!-- ================= ADD NEW ITEM ================= -->

    <section>

        <h2>Add New Menu Item</h2>

        <form id="menuForm">

            <input
                type="text"
                id="itemName"
                placeholder="Item Name"
                required
            >

            <input
                type="text"
                id="itemCategory"
                placeholder="Category"
                required
            >

            <input
                type="number"
                id="itemPrice"
                placeholder="Price"
                required
            >

            <select id="itemAvailability">

                <option value="Available">Available</option>

                <option value="Unavailable">Unavailable</option>

            </select>

            <button type="submit">Add Item</button>

        </form>

    </section>


    <!-- ================= SEARCH AND FILTERS ================= -->

    <section>

        <h2>Search and Filters</h2>

        <!-- Filter 1: Search by name -->

        <input
            type="text"
            id="searchName"
            placeholder="Search by item name"
            oninput="applyFilters()"
        >


        <!-- Filter 2: Category -->

        <select id="categoryFilter" onchange="applyFilters()">

            <option value="All">All Categories</option>

            <option value="Fast Food">Fast Food</option>

            <option value="Pakistani">Pakistani</option>

            <option value="Dessert">Dessert</option>

            <option value="Drinks">Drinks</option>

        </select>


        <!-- Filter 3: Availability -->

        <select id="availabilityFilter" onchange="applyFilters()">

            <option value="All">All Availability</option>

            <option value="Available">Available</option>

            <option value="Unavailable">Unavailable</option>

        </select>


        <!-- Filter 4: Price -->

        <select id="priceFilter" onchange="applyFilters()">

            <option value="All">All Prices</option>

            <option value="Low">Below Rs. 500</option>

            <option value="Medium">Rs. 500 - Rs. 1000</option>

            <option value="High">Above Rs. 1000</option>

        </select>


        <!-- Filter 5: Item Type -->

        <select id="typeFilter" onchange="applyFilters()">

            <option value="All">All Item Types</option>

            <option value="Fast Food">Fast Food Items</option>

            <option value="Pakistani">Pakistani Items</option>

            <option value="Dessert">Desserts</option>

            <option value="Drinks">Drinks</option>

        </select>

    </section>


    <!-- ================= MENU CARDS ================= -->

    <section>

        <h2>Restaurant Menu</h2>

        <div id="menuCards"></div>

    </section>


    <!-- ================= EDIT MODAL ================= -->

    <div id="editModal" class="modal">

        <div class="modal-content">

            <h2>Edit Menu Item</h2>

            <input
                type="text"
                id="editName"
                placeholder="Item Name"
            >

            <input
                type="text"
                id="editCategory"
                placeholder="Category"
            >

            <input
                type="number"
                id="editPrice"
                placeholder="Price"
            >

            <select id="editAvailability">

                <option value="Available">Available</option>

                <option value="Unavailable">Unavailable</option>

            </select>

            <br><br>

            <button onclick="updateItem()">Update</button>

            <button onclick="closeModal()">Cancel</button>

        </div>

    </div>


    <!-- ================= IF ELSE SECTION ================= -->

    <section>

        <h2>If-Else Conditions</h2>

        <div id="conditionResults"></div>

    </section>


    <!-- ================= FOR LOOP SECTION ================= -->

    <section>

        <h2>For Loop Output</h2>

        <div id="forLoopResults"></div>

    </section>


    <!-- ================= WHILE LOOP SECTION ================= -->

    <section>

        <h2>While Loop Output</h2>

        <div id="whileLoopResults"></div>

    </section>


    <!-- ================= LOOP + CONDITIONS ================= -->

    <section>

        <h2>Loop with Conditions - Menu Categories</h2>

        <div id="combinedResults"></div>

    </section>


    <script src="script.js"></script>

</body>

</html>
